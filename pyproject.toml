[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hover-inspector"
version = "1.0.0"
description = "Fast native Windows UI element inspector using pywinauto and Win32"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywinauto==0.6.9",
    "pywin32>=311; sys_platform == 'win32'",
    "psutil>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[project.scripts]
hover-inspector = "hover_inspector.app:main"

[tool.hatch.build.targets.wheel]
packages = ["hover_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
